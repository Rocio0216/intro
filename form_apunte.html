<!DOCTYPE html>
<html>
<head>
    <title>Formularios</title>
</head>
<body>
   <form>
     <input type="text">   //escribe texto
     <input type="email">   //escribe correo es necesario @ para q concidera se puedautilizar
     <input type="password">   //escribe contraseña
     <input type="checkbox">   //casilla de verificación (con tilde)
     <input type="radio">   //botón de opción
     <input type="file">   //seleccionar archivo
     <input type="date">   //seleccionar fecha
     <input type="submit">   //enviar formulario

   </form>
</body>
</html>
